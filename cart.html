<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | MK Timepiece</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            color: #111;
        }

        header {
            background: #080808;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #f2ca62;
            font-family: Georgia, serif;
            font-size: 25px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            border: 1px solid #d6a73a;
            padding: 9px 18px;
            border-radius: 20px;
        }

        .back:hover {
            background: #d6a73a;
            color: #111;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 38px;
            margin-bottom: 30px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .cart-items {
            background: white;
            border-radius: 12px;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 8px;
        }

        .item-price {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        .remove {
            border: none;
            background: none;
            color: #d33;
            cursor: pointer;
            margin-top: 10px;
        }

        .summary {
            background: white;
            border-radius: 12px;
            padding: 25px;
            height: fit-content;
        }

        .summary h2 {
            font-family: Georgia, serif;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 18px;
            font-size: 21px;
            font-weight: bold;
        }

        .checkout {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(
                135deg,
                #f5d477,
                #c69228
            );
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .checkout:hover {
            transform: translateY(-2px);
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
        }

        .empty h2 {
            font-family: Georgia, serif;
            margin-bottom: 15px;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 20px;
            background: #111;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
        }

        @media (max-width: 750px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                align-items: flex-start;
            }

            .cart-item img {
                width: 85px;
                height: 85px;
            }

            .item-info h3 {
                font-size: 15px;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        MK TIMEPIECE
    </div>

    <a href="index.html" class="back">
        ← Continue Shopping
    </a>

</header>


<div class="container">

    <h1>Shopping Cart 🛒</h1>

    <div class="cart-layout">

        <div class="cart-items" id="cartItems"></div>

        <div class="summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₹0</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="shipping">₹0</span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span id="total">₹0</span>
            </div>

            <button class="checkout" onclick="checkout()">
                Proceed to Checkout →
            </button>

        </div>

    </div>

</div>


<script>

    let cart = JSON.parse(
        localStorage.getItem("mkCart")
    ) || [];


    function displayCart() {

        const cartItems =
            document.getElementById("cartItems");

        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty">

                    <h2>Your Cart is Empty 🛒</h2>

                    <p>
                        Looks like you haven't added
                        any watches yet.
                    </p>

                    <a href="index.html"
                       class="shop-btn">
                        Shop Watches
                    </a>

                </div>
            `;

            updateSummary();

            return;
        }


        cartItems.innerHTML = "";


        cart.forEach((item, index) => {

            cartItems.innerHTML += `

                <div class="cart-item">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="item-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <div class="item-price">
                            ₹${item.price.toLocaleString("en-IN")}
                        </div>

                        <div class="quantity">

                            <button
                                onclick="changeQuantity(${index}, -1)">
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="changeQuantity(${index}, 1)">
                                +
                            </button>

                        </div>

                        <button
                            class="remove"
                            onclick="removeItem(${index})">

                            Remove

                        </button>

                    </div>

                </div>
            `;
        });


        updateSummary();
    }


    function changeQuantity(index, change) {

        cart[index].quantity += change;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        saveCart();

        displayCart();
    }


    function removeItem(index) {

        cart.splice(index, 1);

        saveCart();

        displayCart();
    }


    function updateSummary() {

        let subtotal = 0;


        cart.forEach(item => {

            subtotal +=
                item.price *
                item.quantity;

        });


        let shipping =
            subtotal >= 999 || subtotal === 0
                ? 0
                : 99;


        document.getElementById("subtotal")
            .innerText =
            "₹" +
            subtotal.toLocaleString("en-IN");


        document.getElementById("shipping")
            .innerText =
            shipping === 0
                ? "FREE"
                : "₹" + shipping;


        document.getElementById("total")
            .innerText =
            "₹" +
            (subtotal + shipping)
            .toLocaleString("en-IN");
    }


    function saveCart() {

        localStorage.setItem(
            "mkCart",
            JSON.stringify(cart)
        );
    }


    function checkout() {

        if (cart.length === 0) {

            alert(
                "Your cart is empty."
            );

            return;
        }


        alert(
            "Checkout page will be added next! ❤️"
        );
    }


    displayCart();

</script>

</body>
</html>
